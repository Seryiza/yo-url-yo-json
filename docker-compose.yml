services:
  cloakbrowser:
    image: cloakhq/cloakbrowser:latest
    command: ["cloakserve"]
    environment:
      CLOAKBROWSER_AUTO_UPDATE: "false"
    ports:
      - "127.0.0.1:9222:9222"
    volumes:
      - cloakbrowser-cache:/root/.cloakbrowser

volumes:
  cloakbrowser-cache:
    name: yo-url-yo-json-cloakbrowser-cache
